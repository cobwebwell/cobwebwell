<svg xmlns="http://www.w3.org/2000/svg" width="960" height="206" viewBox="0 0 960 206">
<style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'DejaVu Sans Mono','Courier New',monospace;fill:#e8e8e8;font-size:16px}
.d{fill:#5a5a5a} .m{fill:#969696} .b{font-weight:700} .s{font-size:13px}
.r{opacity:0;animation:in .01s steps(1) forwards}
@keyframes in{to{opacity:1}}
@keyframes blink{50%{opacity:0}}
.cur{animation:blink 1s steps(1) infinite}

</style>
<rect x=".5" y=".5" width="959" height="205" fill="#0a0a0a" stroke="#323232"/>
<rect x="1" y="1" width="958" height="29" fill="#161616"/>
<line x1="0" y1="30.5" x2="960" y2="30.5" stroke="#282828"/>
<g fill="none" stroke="#969696"><circle cx="20" cy="15" r="6"/><circle cx="42" cy="15" r="6"/><circle cx="64" cy="15" r="6"/></g>
<text x="480" y="20" text-anchor="middle" class="d s">cobwebwell@github: ~/eof</text>
<text x="28" y="64" class="m" xml:space="preserve">$ </text><text x="46" y="64" class="" xml:space="preserve">sqlite3 ~/life.db &lt; motto.sql</text>
<g class="r" style="animation-delay:0.50s"><text x="28" y="94" class="m" xml:space="preserve">CREATE TABLE IF NOT EXISTS ideas (thing TEXT PRIMARY KEY);</text></g>
<g class="r" style="animation-delay:0.90s"><text x="28" y="118" class="m" xml:space="preserve">INSERT OR IGNORE INTO ideas VALUES (&#x27;whatever is missing&#x27;);</text></g>
<g class="r" style="animation-delay:1.40s"><text x="28" y="150" class="b" xml:space="preserve">Query OK, 1 row affected.</text></g>
<g class="r" style="animation-delay:1.80s"><text x="28" y="182" class="m" xml:space="preserve">$ </text><rect class="cur" x="46" y="168" width="10" height="18" fill="#e8e8e8"/></g>
</svg>